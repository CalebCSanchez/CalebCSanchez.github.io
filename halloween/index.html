<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Halloween Night | Caleb Sanchez</title>
  <link rel="stylesheet" href="/css/halloween/rankchoice.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/images/favicon.png">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/index.html">☾ Halloween <b>Night</b></a>
  </header>
  <main class="shell">
    <p class="eyebrow">✦ CHOOSE YOUR POISON</p>
    <h1 class="title">Halloween <span>Night</span></h1>
    <div class="choice-grid">
      <a class="choice" href="/halloween/bingo/">
        <div class="big-emoji">🎃</div>
        <h2>Midnight Bingo</h2>
        <p class="muted">Haunted number caller for the host.</p>
      </a>
      <a class="choice" href="/halloween/rankchoice/">
        <div class="big-emoji">🦇</div>
        <h2>Costume Contest</h2>
        <p class="muted">Ranked-choice voting for the best costume.</p>
      </a>
    </div>
  </main>
</body>
</html>
